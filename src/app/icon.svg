<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" width="32" height="32" role="img" aria-label="geunyang math">
  <!--
    The sidebar's brand mark, drawn as a file so a browser tab can show it. The shape is the one
    `.brand-mark` builds in globals.css: four tiles in a 2×2 grid, each rounded on its outer corner
    and tight on the three that face the middle, the whole thing tilted six degrees. Its own colours,
    not the theme's tokens — an icon is served as a file and never sees the page's stylesheet.

    No plate behind it. A tab strip is light or dark depending on the reader's system, and the three
    pale tiles carry the shape on either. Change this and change `.brand-mark` with it.
  -->
  <g transform="rotate(-6 16 16)">
    <path fill="#35624d" d="M13.61 2.8H13.61A1.29 1.29 0 0 1 14.9 4.09V13.61A1.29 1.29 0 0 1 13.61 14.9H4.79A1.29 1.29 0 0 1 3.5 13.61V12.91A10.11 10.11 0 0 1 13.61 2.8Z"/>
    <path fill="#93a887" d="M18.39 2.8H18.39A10.11 10.11 0 0 1 28.5 12.91V13.61A1.29 1.29 0 0 1 27.21 14.9H18.39A1.29 1.29 0 0 1 17.1 13.61V4.09A1.29 1.29 0 0 1 18.39 2.8Z"/>
    <path fill="#75916a" d="M4.79 17.1H13.61A1.29 1.29 0 0 1 14.9 18.39V27.91A1.29 1.29 0 0 1 13.61 29.2H13.61A10.11 10.11 0 0 1 3.5 19.09V18.39A1.29 1.29 0 0 1 4.79 17.1Z"/>
    <path fill="#d0936a" d="M18.39 17.1H27.21A1.29 1.29 0 0 1 28.5 18.39V19.09A10.11 10.11 0 0 1 18.39 29.2H18.39A1.29 1.29 0 0 1 17.1 27.91V18.39A1.29 1.29 0 0 1 18.39 17.1Z"/>
  </g>
</svg>

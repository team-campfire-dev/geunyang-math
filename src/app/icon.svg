<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 600" width="600" height="600" role="img" aria-label="그냥수학">
  <!--
    The brand mark, drawn as a file so a browser tab can show it. It is the same drawing the `Brand`
    component makes in learning-workspace.tsx, path for path; tests/app-icons.test.ts holds them
    equal, because nothing else links a file Next serves on its own to a component in the bundle.

    One drawing serves every size. An outlined set square closed into a blob below about thirty
    pixels; filled solid it survives to sixteen, where the clay wedge is the thing that identifies
    this.

    Two measurements set the ruler. Its apex stops at 207, the height where the ears start rising off
    the skull rather than at their tips, and its lower-left corner sits at 302, which is the middle
    of the face — the head is drawn at 0.88 around (302, 290), so both numbers fall out of that.
    Everything is then placed so the whole drawing is centred in the plate.

    Colours are written out because an icon never sees the stylesheet. Paper, ink, clay.
  -->
  <path d="M468 0H132C59.0984 0 0 59.0984 0 132V468C0 540.902 59.0984 600 132 600H468C540.902 600 600 540.902 600 468V132C600 59.0984 540.902 0 468 0Z" fill="#FAF6EE"/>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 600" width="600" height="600" fill="none" role="img" aria-label="그냥수학">
  <!--
    The brand mark, drawn as a file so a browser tab can show it. It is the same drawing the `Brand`
    component makes in learning-workspace.tsx, path for path; tests/app-icons.test.ts holds them
    equal, because nothing else links a file Next serves on its own to a component in the bundle.

    The paths are not ours. They are lifted unchanged out of ~/Documents/그냥스타일/download.svg — the
    commissioned mark, as vector — with the wordmark below it dropped and the rest set on this plate
    by the single transform below. Earlier passes read landmarks off a raster of the same drawing
    and joined them up, and got the ears and the paw wrong twice; nothing here is measured, so
    nothing here can be off.

    Colours are written out because an icon never sees the stylesheet. Paper, ink, clay — and the
    file already came in those, so it needed no repainting.
  -->
  <path d="M468 0H132C59.0984 0 0 59.0984 0 132V468C0 540.902 59.0984 600 132 600H468C540.902 600 600 540.902 600 468V132C600 59.0984 540.902 0 468 0Z" fill="#FAF6EE"/>
  <g transform="translate(-125.6 -72.9) scale(1.9)" stroke-linecap="round" stroke-linejoin="round">
    <!-- 얼굴. 한 획으로 왼뺨을 올라 두 귀를 넘고, 자에 닿기 전 허공에서 끝난다 -->
    <g stroke="#141414" stroke-width="13">
      <path d="M143 251 C127 240 120 223 121 203 C122 180 132 162 152 150 C155 130 164 114 173 104 C192 112 208 125 221 142 C234 125 252 113 271 104 C282 117 289 132 292 150 C298 153 304 158 309 164"/>
    </g>
    <!-- 감은 눈 -->
    <g stroke="#141414" stroke-width="11">
      <path d="M182 201 C188 209 201 209 207 200"/>
      <path d="M237 200 C243 209 256 209 262 201"/>
    </g>
    <!-- 수염 -->
    <g stroke="#D2674A" stroke-width="10">
      <path d="M103 207 C117 201 131 199 146 201"/>
      <path d="M110 232 C121 223 132 219 146 219"/>
    </g>
    <!-- 앞발. 턱이 있을 자리에 놓인다 -->
    <g stroke="#141414" stroke-width="12">
      <path d="M124 288 H177 C193 291 205 281 200 267 C195 253 178 246 160 250 C142 253 131 267 130 282"/>
    </g>
    <!-- 삼각자. 가운데가 비어 보여야 해서 한 길 안의 두 고리로 그린다 -->
    <g fill="#D2674A">
      <path fill-rule="evenodd" d="M338 150 C342 146 350 149 350 155 V287 C350 292 347 295 342 295 H213 C206 295 203 288 208 283 Z M324 194 L248 273 H324 Z"/>
      <path d="M305 234 C307 231 311 233 311 237 V257 C311 259 310 260 308 260 H287 C284 260 283 257 285 255 Z"/>
    </g>
  </g>
</svg>

# Include this file once from NPM's /data/nginx/custom/http.conf.
# Managed by this repository; it is intentionally separate from NPM-generated hosts.
map $http_upgrade $geunyang_math_connection {
    default upgrade;
    '' close;
}

server {
    listen 80;
    listen [::]:80;
    server_name geunyang-math.team-campfire.dev;
    return 308 https://$host$request_uri;
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name geunyang-math.team-campfire.dev;

    ssl_certificate /etc/letsencrypt/live/npm-8/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/npm-8/privkey.pem;
    include conf.d/include/ssl-cache.conf;
    include conf.d/include/ssl-ciphers.conf;

    client_max_body_size 16k;
    client_body_timeout 15s;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
    access_log /data/logs/geunyang-math_access.log proxy;
    error_log /data/logs/geunyang-math_error.log warn;

    location / {
        proxy_pass http://10.0.0.130:3007;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $geunyang_math_connection;
        proxy_connect_timeout 5s;
        proxy_read_timeout 60s;
        proxy_send_timeout 60s;
        proxy_buffering off;
    }
}
